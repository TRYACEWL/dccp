data:
  tokenizer: null
  task_suite_name: libero_10
  num_trials_per_task: 50
  filter_warmup: False
  prompt_key: prompt
  system_prompt: null
  max_prompt_length: 512
  max_response_length: 512
  train_batch_size: 1024
  val_batch_size: 1312
  return_raw_input_ids: False
  return_raw_chat: False
  n_samples: 1
  filter_accuracy: False
  filter_truncated: False
  accuracy_lower_bound: 0.0
  accuracy_upper_bound: 1.0
  oversample_factor: 1.0
  filter_format: True
  zero: False
  sample_num: -1

use_dccp_branch: False

scorer:
  type: lrm

  completion_endpoint: "http://127.0.0.1:8001/completion"
  progress_endpoint: "http://127.0.0.1:8002/progress"

  completion_batch_endpoint: null
  progress_batch_endpoint: null

  timeout_sec: 60
  max_retries: 2
  retry_sleep_sec: 1.0

  use_cache: true
  cache_dir: "./cache/lrm_scores"
  jpeg_quality: 95

lrm_input:
  camera: "cam_high"
  completion_num_keyframes: 8
  progress_num_keyframes: 4
  image_size: 224

dccp:
  horizon_H: 3
  state_budget_per_traj: 2
  nms_gap: 2

  lambda_curvature: 1.0
  lambda_entropy: 1.0
  require_entropy: true

  num_candidates: 8
  max_branches_per_state: null

  candidate_temperature: 1.0
  candidate_top_p: 1.0
  candidate_top_k: 0

  margin_pos: 0.10
  margin_neg: 0.10

  max_pairs_per_state: null
  max_pairs_per_rollout: 4
  max_pairs_per_batch: 64

  require_completion_score: true

  beta_dpo: 0.1
  lambda_pref: 0.3
  lambda_pref_warmup_steps: 1000

  discard_uniform_grpo_groups: true

actor_rollout_ref:
  use_dccp_branch: ${use_dccp_branch}
  scorer: ${scorer}
  lrm_input: ${lrm_input}
  dccp: ${dccp}

  wm:
    enable: False
    inference_config_path: ./configs/libero/inference/sdxl_simplevla.py
    train_config_path: ./configs/libero/train/sdxl_simplevla_web_mix.py

  hybrid_engine: True

  model:
    vla: openvla-oft
    action_token_len: 7
    action_chunks_len: 8
    path: checkpoint_files/base_models/deepseek-llm-7b-chat
    external_lib: null
    override_config: { }
    enable_gradient_checkpointing: False
    use_remove_padding: False
    lora_rank: 0
    lora_alpha: 32
    target_modules: all-linear
    dataset_statistics_path: null

  actor:
    use_dccp_branch: ${use_dccp_branch}
    dccp: ${dccp}

    vla: ${actor_rollout_ref.model.vla}
    action_token_len: ${actor_rollout_ref.model.action_token_len}
    action_chunks_len: ${actor_rollout_ref.model.action_chunks_len}
    strategy: fsdp
    traj_mini_batch_size: 16
    ppo_mini_batch_size: 256
    ppo_micro_batch_size: 64
    use_dynamic_bsz: False
    use_remove_padding: ${actor_rollout_ref.model.use_remove_padding}
    ppo_max_token_len_per_gpu: 20480
    grad_clip: 1.0
    clip_ratio_high: 0.28
    clip_ratio_low: 0.2
    entropy_coeff: 0.001
    ppo_epochs: 1
    shuffle: True
    ulysses_sequence_parallel_size: 1
    num_images_in_input: 1

    optim:
      lr: 1e-6
      lr_warmup_steps_ratio: 0.
      min_lr_ratio: null
      warmup_style: constant
      total_training_steps: -1

    fsdp_config:
      wrap_policy:
        min_num_params: 0
      param_offload: False
      grad_offload: False
      optimizer_offload: False
      fsdp_size: -1

  ref:
    use_dccp_branch: ${use_dccp_branch}
    dccp: ${dccp}

    fsdp_config:
      param_offload: False
      wrap_policy:
        min_num_params: 0
      fsdp_size: -1

    log_prob_micro_batch_size: 128
    log_prob_use_dynamic_bsz: ${actor_rollout_ref.actor.use_dynamic_bsz}
    log_prob_max_token_len_per_gpu: ${actor_rollout_ref.actor.ppo_max_token_len_per_gpu}
    ulysses_sequence_parallel_size: ${actor_rollout_ref.actor.ulysses_sequence_parallel_size}

  rollout:
    use_dccp_branch: ${use_dccp_branch}
    scorer: ${scorer}
    lrm_input: ${lrm_input}
    dccp: ${dccp}

    vla: ${actor_rollout_ref.model.vla}
    action_chunks_len: ${actor_rollout_ref.model.action_chunks_len}
    experiment_name: None
    unnorm_key: libero_10
    micro_batch_size: 1
    val_micro_batch_size: 8
    model_family: openvla
    task_suite_name: libero_10
    num_steps_wait: 10
    pretrained_checkpoint: None
    center_crop: True
    max_prompt_length: 512
    num_images_in_input: 1
    name: vllm
    temperature: 1.0
    top_k: -1
    top_p: 1
    prompt_length: ${data.max_prompt_length}
    response_length: ${data.max_response_length}

    dtype: bfloat16
    gpu_memory_utilization: 0.5
    ignore_eos: False
    enforce_eager: True
    free_cache_engine: True
    load_format: dummy_dtensor
    tensor_model_parallel_size: 2
    max_num_batched_tokens: 8192
    max_num_seqs: 1024
    log_prob_micro_batch_size: 128
    log_prob_use_dynamic_bsz: ${actor_rollout_ref.actor.use_dynamic_bsz}
    log_prob_max_token_len_per_gpu: ${actor_rollout_ref.actor.ppo_max_token_len_per_gpu}

    do_sample: True
    n: 1

critic:
  strategy: fsdp
  optim:
    lr: 1e-5
    lr_warmup_steps_ratio: 0.
    min_lr_ratio: null
    warmup_style: constant
    total_training_steps: -1

  model:
    action_token_len: ${actor_rollout_ref.model.action_token_len}
    action_chunks_len: ${actor_rollout_ref.model.action_chunks_len}
    path: ~/models/deepseek-llm-7b-chat
    tokenizer_path: ${actor_rollout_ref.model.path}
    override_config: { }
    external_lib: ${actor_rollout_ref.model.external_lib}
    use_remove_padding: ${actor_rollout_ref.model.use_remove_padding}
    enable_gradient_checkpointing: ${actor_rollout_ref.model.enable_gradient_checkpointing}

    fsdp_config:
      param_offload: ${actor_rollout_ref.actor.fsdp_config.param_offload}
      grad_offload: ${actor_rollout_ref.actor.fsdp_config.grad_offload}
      optimizer_offload: ${actor_rollout_ref.actor.fsdp_config.optimizer_offload}
      wrap_policy:
        min_num_params: 0
      fsdp_size: -1

    lora_rank: 0
    lora_alpha: 32
    target_modules: all-linear
    type: value

  ppo_mini_batch_size: ${actor_rollout_ref.actor.ppo_mini_batch_size}
  ppo_micro_batch_size: 64
  forward_micro_batch_size: ${critic.ppo_micro_batch_size}
  use_dynamic_bsz: ${actor_rollout_ref.actor.use_dynamic_bsz}
  ppo_max_token_len_per_gpu: 32768
  forward_max_token_len_per_gpu: ${critic.ppo_max_token_len_per_gpu}
  ulysses_sequence_parallel_size: ${actor_rollout_ref.actor.ulysses_sequence_parallel_size}
  ppo_epochs: ${actor_rollout_ref.actor.ppo_epochs}
  shuffle: ${actor_rollout_ref.actor.shuffle}
  grad_clip: 1.0
  cliprange_value: 0.5

verifier:
  type: prime
  reward_coef: 5

reward_model:
  enable: True
  strategy: fsdp

  model:
    action_token_len: ${actor_rollout_ref.model.action_token_len}
    action_chunks_len: ${actor_rollout_ref.model.action_chunks_len}
    input_tokenizer: ${actor_rollout_ref.model.path}
    path: checkpoint_files/reward_models/FsfairX-LLaMA3-RM-v0.1
    external_lib: ${actor_rollout_ref.model.external_lib}
    use_remove_padding: ${actor_rollout_ref.model.use_remove_padding}

    fsdp_config:
      min_num_params: 0
      param_offload: False

  mini_batch_size: ${actor_rollout_ref.actor.ppo_mini_batch_size}
  micro_batch_size: 64
  max_length: null
  ulysses_sequence_parallel_size: ${actor_rollout_ref.actor.ulysses_sequence_parallel_size}
  use_dynamic_bsz: ${critic.use_dynamic_bsz}
  ppo_max_token_len_per_gpu: ${actor_rollout_ref.actor.ppo_max_token_len_per_gpu}
  forward_max_token_len_per_gpu: ${critic.forward_max_token_len_per_gpu}
  rm_coef: 0
  rm_type: prime
  prime_granularity: token
  prime_norm: batch_norm

  prime_model:
    input_tokenizer: ${actor_rollout_ref.model.path}
    path: checkpoint_files/prime_model
    ref_type: freeze
    ref_path: checkpoint_files/reference_model
    external_lib: ${actor_rollout_ref.model.external_lib}
    enable_gradient_checkpointing: ${actor_rollout_ref.model.enable_gradient_checkpointing}
    use_remove_padding: ${actor_rollout_ref.model.use_remove_padding}

    fsdp_config:
      wrap_policy:
        min_num_params: 0
      param_offload: ${actor_rollout_ref.actor.fsdp_config.param_offload}
      grad_offload: ${actor_rollout_ref.actor.fsdp_config.grad_offload}
      optimizer_offload: ${actor_rollout_ref.actor.fsdp_config.optimizer_offload}

    update: none

    optim:
      lr: 1e-6
      lr_warmup_steps_ratio: 0.
      min_lr_ratio: null
      warmup_style: constant
      total_training_steps: -1
      weight_decay: 0.
      grad_clip: 1.0

    beta_train: 0.05
    loss_type: ce

algorithm:
  gamma: 1.0
  lam: 1.0
  adv_estimator: gae

  adv_params:
    verifier_gamma: ${algorithm.gamma}
    reward_model_gamma: ${algorithm.gamma}

  kl_penalty: kl

  kl_ctrl:
    type: fixed
    kl_coef: 0.001

trainer:
  total_epochs: 30
  total_training_steps: null
  project_name: verl_examples
  experiment_name: gsm8k
  logger: ['console', 'wandb']
  wandb_mode: online
  nnodes: 1
  n_gpus_per_node: 8
  save_freq: -1
  test_freq: -1
  critic_warmup: 0
  default_hdfs_dir: ~/experiments/gsm8k/ppo/${trainer.experiment_name}
  default_local_dir: checkpoints/${trainer.project_name}/${trainer.experiment_name}
  runtime_env: none
  val_before_train: False
  val_only: True
  debug: False